<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Track My Workouts — live build</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fff; color: #111; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  main { max-width: 420px; padding: 32px 24px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 15px; line-height: 1.5; color: #555; margin: 8px 0; }
  a { color: #007aff; }
  .status { font-size: 13px; color: #888; }
</style>
</head>
<body>
<main>
  <h1>Track My Workouts</h1>
  <p id="message">Loading the live build&hellip;</p>
  <p class="status" id="status"></p>
  <p id="fallback" hidden>Or open the <a href="./player/index.html">Iteration Player</a> to pick any version.</p>
  <noscript><p>JavaScript is needed for the automatic redirect. Open the <a href="./player/index.html">Iteration Player</a> to pick a version.</p></noscript>
</main>
<script>
(function () {
  'use strict';
  var msg = document.getElementById('message');
  var status = document.getElementById('status');
  var fallback = document.getElementById('fallback');
  function showFallback(text) {
    msg.textContent = text;
    fallback.hidden = false;
  }
  fetch('./versions.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (manifest) {
      var live = manifest && manifest.live;
      if (!live) {
        showFallback('No live version is set yet.');
        return;
      }
      var entry = null;
      (manifest.versions || []).forEach(function (v) { if (v.version === live) entry = v; });
      if (!entry || !entry.url) {
        showFallback('The live version (v' + live + ') has no URL in the manifest.');
        return;
      }
      // Tolerate a stale manifest: say exactly which version this page
      // served, so a delayed publish is visible rather than silent.
      var label = entry.label ? ' \u2014 ' + entry.label : '';
      msg.textContent = 'Opening the live build: v' + live + label;
      status.textContent = 'Served from the manifest fetched at ' +
        new Date().toLocaleTimeString() + '. If this is an older version than expected, the manifest may still be propagating \u2014 try the Iteration Player.';
      setTimeout(function () { window.location.replace(entry.url); }, 600);
    })
    .catch(function (err) {
      showFallback('Couldn\u2019t load the version list (' + err.message + ').');
    });
})();
</script>
</body>
</html>
